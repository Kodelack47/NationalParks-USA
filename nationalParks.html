<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Search U.S. national parks by state, park type, or keyword.">
  <title>Find a National Park | The Eco-Life</title>
  <link rel="stylesheet" href="styles/site.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">The <span>Eco</span>-Life</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
      <nav class="site-nav" id="site-nav" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="nationalParks.html" class="active" aria-current="page">National Parks</a>
        <a href="mountains.html">Mountains</a>
        <a href="booking.html">Book a Tour</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero hero--small">
      <div class="container">
        <h1>Find a national park</h1>
        <p>Filter more than 350 parks, monuments, and historic sites by state, by type, or by keyword.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <form class="filters" role="search" onsubmit="return false">
          <div>
            <label for="state">State or territory</label>
            <select id="state"><option value="">Any state</option></select>
          </div>
          <div>
            <label for="parkType">Park type</label>
            <select id="parkType"><option value="">Any type</option></select>
          </div>
          <div>
            <label for="keyword">Keyword</label>
            <input id="keyword" type="search" placeholder="e.g. Yellowstone, canyon, Boston" autocomplete="off">
          </div>
          <button class="btn btn-primary" id="reset" type="button">Reset</button>
        </form>
        <p class="result-count" id="count" aria-live="polite"></p>
        <div class="grid" id="results"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div>
        <p><strong>The Eco-Life</strong>: explore America's parks and peaks.</p>
        <p>&copy; <span id="year">2026</span> Ousmana Tunkara</p>
      </div>
      <nav aria-label="Footer">
        <a href="nationalParks.html">National Parks</a>
        <a href="mountains.html">Mountains</a>
        <a href="about.html">About</a>
        <a href="terms.html">Terms</a>
      </nav>
    </div>
  </footer>

  <script src="scripts/site.js"></script>
  <script src="scripts/nationalParksData.js"></script>
  <script src="scripts/locationData.js"></script>
  <script src="scripts/parkTypeData.js"></script>
  <script src="scripts/parks.js"></script>
</body>
</html>
